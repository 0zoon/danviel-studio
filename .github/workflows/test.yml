name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Built file matches the source
        run: |
          out=$(python3 build.py --check 2>&1) || { echo "::error::$(echo "$out" | tail -6 | tr '\n' ' ')"; exit 1; }
          echo "$out"
      - name: Install Chromium
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Smoke test
        run: python3 tests/smoke.py
